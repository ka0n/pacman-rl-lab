[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacman-rl-lab"
version = "0.9.4"
description = "Pac-Man inspired gridworld for reproducible reinforcement learning experiments"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "third_party/*LICENSE*.txt"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pygame>=2.6,<3",
  "gymnasium>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["torch>=2.8,<3"]

[project.urls]
Repository = "https://github.com/ka0n/pacman-rl-lab"
Issues = "https://github.com/ka0n/pacman-rl-lab/issues"
Documentation = "https://github.com/ka0n/pacman-rl-lab#readme"

[tool.setuptools.packages.find]
include = ["pacman_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
