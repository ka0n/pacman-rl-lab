# Keep Python, native Rust, and CI dependencies up to date.
# The Rust engine currently has no external crates; this entry covers future additions.
# Python pins live in requirements/requirements-macos-py313.txt.
# Direct pins repeat pyproject.toml's upper bounds so updates stay compatible.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/native/pacman_native"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
