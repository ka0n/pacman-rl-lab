name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Apple Silicon / Python 3.13 / Rust
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements/requirements-macos-py313.txt
      - name: Verify native runner and toolchains
        run: |
          uname -m
          test "$(uname -m)" = arm64
          python --version
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          rustc --version
      - name: Install pinned dependencies and project
        run: |
          python -m pip install -r requirements/requirements-macos-py313.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Build and test native simulator
        run: |
          cargo test --release --locked --manifest-path native/pacman_native/Cargo.toml
          cargo build --release --locked --manifest-path native/pacman_native/Cargo.toml
      - name: Runtime information
        run: python -m pacman_lab.macos doctor
      - name: Publication hygiene
        run: python scripts/check_publication.py
      - name: Python regression tests
        run: python -m pytest -q
      - name: Python and Rust parity
        run: python -m pacman_lab.native_bench verify --episodes 4
      - name: Bounded CPU smoke with both engines
        run: python -m pacman_lab.macos smoke --device cpu --engine both --steps 32
      - name: MPS smoke when Metal is available
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import torch
          if torch.backends.mps.is_available():
              subprocess.run([sys.executable, '-m', 'pacman_lab.macos', 'smoke',
                              '--device', 'mps', '--engine', 'both', '--steps', '32'], check=True)
          else:
              print('Metal unavailable on this VM; CPU/Rust smoke passed; MPS checks skipped.')
          PY
